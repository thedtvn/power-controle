<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Custom titlebar -->
  <div class="titlebar" data-tauri-drag-region>
    <span class="titlebar-title" data-tauri-drag-region>Power Control</span>
    <button class="titlebar-close" id="titlebar-close" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10">
        <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="app">
    <section class="card">
      <h2>Current Status</h2>
      <div class="status-grid">
        <div class="status-item">
          <span class="label">Power Plan</span>
          <span class="value" id="current-scheme">&mdash;</span>
        </div>
        <div class="status-item">
          <span class="label">Power Source</span>
          <span class="value" id="power-source">&mdash;</span>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>General</h2>
      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="autostart" />
          <span class="slider"></span>
        </label>
        <span>Start with Windows</span>
      </div>
    </section>

    <section class="card">
      <h2>Auto-Switch</h2>
      <p class="hint">Automatically change power plan when switching between AC and battery power.</p>

      <div class="toggle-row">
        <label class="toggle">
          <input type="checkbox" id="auto-switch" />
          <span class="slider"></span>
        </label>
        <span>Enable auto-switch</span>
      </div>

      <div id="auto-opts" class="auto-opts disabled">
        <div class="field">
          <label for="on-ac">On AC Power</label>
          <select id="on-ac">
            <option value="balanced">Balanced</option>
            <option value="high_performance">High Performance</option>
            <option value="power_saver">Power Saver</option>
          </select>
        </div>
        <div class="field">
          <label for="on-battery">On Battery</label>
          <select id="on-battery">
            <option value="balanced">Balanced</option>
            <option value="high_performance">High Performance</option>
            <option value="power_saver">Power Saver</option>
          </select>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="save-btn" class="btn">Save Settings</button>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
